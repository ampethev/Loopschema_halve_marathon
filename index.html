function openLog(w,i){const s=weeks[w-1].sessions[i], old=getLog(w,i)||{};document.getElementById('modalTitle').textContent=`Week ${w} · ${s[0]}`;document.getElementById('modalSub').textContent=s[1];document.getElementById('modalBody').innerHTML=`<div class="card" style="margin-top:12px"><div class="form-grid"><div class="field"><label>Datum</label><input id="fdate" type="date" value="${old.date||''}"></div><div class="field"><label>Status</label><select id="fstatus"><option value="done" ${old.status==='done'?'selected':''}>Uitgevoerd</option><option value="skipped" ${old.status==='skipped'?'selected':''}>Overgeslagen</option></select></div><div class="field"><label>Afstand (km)</label><input id="fdist" type="number" step="0.1" value="${old.distance??''}"></div><div class="field"><label>Duur (min)</label><input id="fdur" type="number" step="1" value="${old.duration??''}"></div><div class="field"><label>Gem. hartslag</label><input id="fhr" type="number" step="1" value="${old.hr??''}"></div><div class="field"><label>RPE 1–10</label><input id="frpe" type="number" min="1" max="10" step="1" value="${old.rpe??''}"></div><div class="field full notes"><label>Opmerking</label><textarea id="fnotes" placeholder="Hoe voelde het? Pijn, vermoeidheid, bijzonderheden…">${old.notes||''}</textarea></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="saveLog(${w},${i})">Bewaren</button>${old.status?`<button class="btn danger" onclick="deleteLog(${w},${i})">Verwijderen</button>`:''}</div></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveLog(w,i){const obj={date:fdate.value,status:fstatus.value,distance:Number(fdist.value)||0,duration:Number(fdur.value)||0,hr:Number(fhr.value)||0,rpe:Number(frpe.value)||0,notes:fnotes.value.trim()};localStorage.setItem(logKey(w,i),JSON.stringify(obj));localStorage.setItem(k(w,i),obj.status==='done'?'1':'0');closeModal();renderAll()}
function deleteLog(w,i){localStorage.removeItem(logKey(w,i));localStorage.removeItem(k(w,i));closeModal();renderAll()}
function renderWeeks(){weeksEl.innerHTML=weeks.map(x=>`<article class="card"><div class="week-head"><div><div class="week-title">Week ${x.w}</div><div class="muted">${x.dates}</div></div><span class="badge">${x.focus}</span></div>${x.sessions.map((s,i)=>{const st=sessionStatus(x.w,i);return `<div class="session"><span><b>${s[0]} · ${s[1]}</b><small>${s[2]}</small>${st?`<span class="pill" style="margin-top:5px">${st==='done'?'✓ uitgevoerd':'overgeslagen'}</span>`:''}</span><div class="session-actions"><button class="btn ${st==='done'?'':'primary'}" onclick="openLog(${x.w},${i})">${st?'Wijzig':'Log'}</button></div></div>`}).join('')}</article>`).join('')}
function currentWeek(){const start=new Date('2026-08-17T00:00:00');const now=new Date();const diff=Math.floor((now-start)/86400000);return Math.max(0,Math.min(15,Math.floor(diff/7)))}
function advice(){const logs=[];for(const w of weeks)for(let i=0;i<w.sessions.length;i++){const l=getLog(w.w,i);if(l)logs.push(l)}const recent=logs.filter(x=>x.status==='done').slice(-4);if(!recent.length)return 'Log na elke training kort je afstand, hartslag en gevoel. Na enkele trainingen kan de app gerichter adviseren.';const high=recent.filter(x=>x.rpe>=8).length;const hrs=recent.filter(x=>x.hr>=145).length;if(high>=2)return 'De laatste trainingen voelden relatief zwaar. Maak de eerstvolgende intensieve training rustig of korter en geef herstel voorrang.';if(hrs>=3)return 'Je recente hartslag lag vaak hoog. Controleer of rustige trainingen echt rustig blijven en houd de lange duurloop beheerst.';return 'Je recente belasting oogt evenwichtig. Houd het schema aan en verhoog niets extra bovenop de geplande opbouw.'}
function renderToday(){const w=weeks[currentWeek()];const done=w.sessions.filter((_,i)=>sessionStatus(w.w,i)==='done').length;today.innerHTML=`<div class="hero"><h2>Week ${w.w} · ${w.focus}</h2><p>${w.dates}</p><div class="progress"><div style="width:${done/w.sessions.length*100}%"></div></div><p class="muted">${done}/${w.sessions.length} geplande dagen geregistreerd als uitgevoerd</p></div><div class="card">${w.sessions.map((s,i)=>`<div class="session"><span><b>${s[0]} · ${s[1]}</b><small>${s[2]}</small></span><div class="session-actions"><button class="btn primary" onclick="openLog(${w.w},${i})">${sessionStatus(w.w,i)?'Wijzig':'Log'}</button></div></div>`).join('')}</div><div class="card advice"><h3>Advies</h3><p>${advice()}</p></div><div class="card"><h3>Vaste weekindeling</h3><p><b>Ma:</b> kracht A · <b>Di:</b> lopen · <b>Wo:</b> kracht B · <b>Do:</b> lopen · <b>Vr:</b> lichte kracht/core · <b>Za:</b> rust · <b>Zo:</b> lange duurloop.</p></div>`}
function renderStrength(){strength.innerHTML=`<div class="hero"><h2>Core & kracht · 3× per week</h2><p>Maandag is de stevigste sessie, woensdag focust op romp/heupstabiliteit en vrijdag blijft bewust licht. Zo ondersteunt de krachttraining het lopen zonder de lange duurloop te saboteren.</p></div><div class="card"><h3>Training A · maandag · 20–30 min</h3><p><b>Squat · Glute bridge · Calf raise · Plank · Bird dog.</b><br><span class="muted">Week 1–4: 2 sets. Vanaf week 5: 2–3 sets als je goed herstelt. Rust 45–75 sec tussen sets.</span></p><h3>Training B · woensdag · 20–25 min</h3><p><b>Dead bug · Side plank · Split squat · Bird dog · Glute bridge.</b><br><span class="muted">Controle en stabiliteit zijn belangrijker dan snelheid of extra gewicht.</span></p><h3>Training C · vrijdag · 10–20 min</h3><p><b>Plank · Dead bug · Calf raise · Glute bridge</b> + rustige mobiliteit.<br><span class="muted">Bewust licht: 1–2 sets en altijd stoppen met ruime reserve. Geen spierpijn nastreven.</span></p></div><div class="card">${exercises.map(e=>`<div class="exercise"><div class="drawing">${fig(e.type)}</div><div><h4>${e.name}</h4><span class="pill">${e.dose}</span><div class="how"><p>${e.how}</p><p class="muted"><b>Let op:</b> ${e.mistake}</p></div></div></div>`).join('')}</div><div class="tip"><b>Belangrijk:</b> bij zware benen na donderdag mag vrijdag worden ingekort of overgeslagen. De zondagse lange duurloop heeft prioriteit.</div>`}
function allLogs(){const a=[];for(const w of weeks)for(let i=0;i<w.sessions.length;i++){const l=getLog(w.w,i);if(l)a.push({...l,w:w.w,i,title:w.sessions[i][1]})}return a}
function renderLog(){const a=allLogs().sort((a,b)=>(b.date||'').localeCompare(a.date||''));log.innerHTML=`<div class="hero"><h2>Trainingslogboek</h2><p>Elke geregistreerde training verschijnt hier. Tik in het schema op <b>Log</b> om een training toe te voegen.</p></div><div class="card">${a.length?a.map(x=>`<div class="history-row"><div class="history-date">${x.date||`week ${x.w}`}</div><div><b>${x.title}</b><small class="muted">${x.status==='done'?[x.distance?`${x.distance} km`:'',x.duration?`${x.duration} min`:'',x.hr?`${x.hr} bpm`:'',x.rpe?`RPE ${x.rpe}`:''].filter(Boolean).join(' · '):'overgeslagen'}</small></div><button class="btn" onclick="openLog(${x.w},${x.i})">Open</button></div>`).join(''):'<p class="muted">Nog geen trainingen geregistreerd.</p>'}</div>`}
function renderDashboard(){const a=allLogs().filter(x=>x.status==='done');const km=a.reduce((s,x)=>s+x.distance,0),min=a.reduce((s,x)=>s+x.duration,0),hrs=a.filter(x=>x.hr).map(x=>x.hr),avg=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):0;const rpes=a.filter(x=>x.rpe).map(x=>x.rpe),rpe=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1):'-';dashboard.innerHTML=`<div class="hero"><h2>Voortgang</h2><div class="stat-grid"><div class="stat"><strong>${a.length}</strong><span>trainingen</span></div><div class="stat"><strong>${km.toFixed(1)}</strong><span>km gelogd</span></div><div class="stat"><strong>${Math.round(min/60*10)/10}</strong><span>uur gelopen</span></div><div class="stat"><strong>${avg||'-'}</strong><span>gem. bpm</span></div></div></div><div class="card"><h3>Belastingsgevoel</h3><p>Gemiddelde RPE: <b>${rpe}</b> / 10</p><p class="advice">${advice()}</p></div><div class="card"><h3>Backup</h3><p class="muted">Je gegevens staan alleen op dit toestel/in deze browser. Exporteer af en toe een backup.</p><button class="btn" onclick="exportData()">Exporteer backup</button> <label class="btn">Importeer backup<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div>`}
function exportData(){const data={version:1,exported:new Date().toISOString(),items:{}};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('hm16-'))data.items[key]=localStorage.getItem(key)}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loopcoach-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.entries(d.items||{}).forEach(([k,v])=>localStorage.setItem(k,v));renderAll();alert('Backup geïmporteerd.')}catch{alert('Dit bestand kon niet worden ingelezen.')}};r.readAsText(f)}
function renderZones(){zones.innerHTML=`<div class="hero"><h2>Hartslag als richtlijn</h2><p>Maximale hartslag: <b>182 bpm</b>. Combineer hartslag met gevoel, temperatuur en de praat-test.</p></div><div class="zone-grid"><div class="zone"><strong>Z1 · 91–109</strong><span class="muted">zeer licht</span></div><div class="zone"><strong>Z2 · 109–127</strong><span class="muted">rustige duur</span></div><div class="zone"><strong>Z3 · 127–146</strong><span class="muted">steady</span></div><div class="zone"><strong>Z4 · 146–164</strong><span class="muted">tempo</span></div><div class="zone"><strong>Z5 · 164–182</strong><span class="muted">hard</span></div></div><div class="card"><h3>Praktisch in dit schema</h3><p><b>Rustige/lange duur:</b> meestal 120–135 bpm.</p><p><b>Tempo:</b> stevig maar beheerst; korte zinnen moeten nog lukken.</p><p><b>Intervals/heuvel:</b> stuur vooral op inspanning en techniek omdat hartslag vertraagd reageert.</p></div><div class="tip ok"><b>Uitgangspunt:</b> 5:30/km bij 125–130 bpm is al een prima rustige basis. De komende maanden is geleidelijke duur-opbouw belangrijker dan elke training sneller maken.</div><div class="footer-note">Bij ziekte, scherpe of toenemende pijn, pijn op de borst, flauwvallen of onverklaarde benauwdheid: training stoppen en zo nodig medisch laten beoordelen.</div>`}

const checkinKey=w=>`hm16-checkin-${w}`;
function getCheckin(w){try{return JSON.parse(localStorage.getItem(checkinKey(w))||'null')}catch{return null}}
function saveCheckin(){const w=currentWeek()+1;const c={date:new Date().toISOString().slice(0,10),legs:Number(ciLegs.value),fatigue:Number(ciFatigue.value),sleep:Number(ciSleep.value),motivation:Number(ciMotivation.value),pain:ciPain.value,notes:ciNotes.value.trim()};localStorage.setItem(checkinKey(w),JSON.stringify(c));renderAll();alert('Weekcheck bewaard.');}
function checkinAdvice(w=currentWeek()+1){const c=getCheckin(w);if(!c)return 'Nog geen weekcheck ingevuld. Gebruik deze check één keer per week, idealiter na de laatste training.';if(c.pain==='sharp')return 'Je noteert scherpe of toenemende pijn. Plan geen intensieve training zolang dit aanhoudt; bij aanhoudende of verontrustende klachten is medische beoordeling aangewezen.';const load=(c.legs+c.fatigue+(11-c.sleep)+(11-c.motivation))/4;if(load>=7||c.pain==='moderate')return 'Deze week lijkt herstel belangrijker. Advies: schrap de optionele loop, maak de eerstvolgende kwaliteitstraining 20–30% korter en houd de lange duurloop volledig rustig.';if(load>=5)return 'Lichte vermoeidheid: houd het schema aan, maar voeg geen extra kilometers toe en loop de optionele training alleen als je benen fris aanvoelen.';return 'Je herstelcheck ziet er goed uit. Je kunt de geplande week uitvoeren zonder extra volume bovenop het schema.';}
function renderCheckin(){const w=currentWeek()+1,c=getCheckin(w)||{legs:4,fatigue:4,sleep:7,motivation:7,pain:'none',notes:''};checkin.innerHTML=`<div class="hero"><h2>Weekcheck · week ${w}</h2><p>Een korte herstelcheck om de volgende trainingsweek verstandig bij te sturen.</p></div><div class="card"><div class="score-row"><b>Zware benen</b><input id="ciLegs" type="range" min="1" max="10" value="${c.legs}" oninput="this.nextElementSibling.textContent=this.value"><span>${c.legs}</span></div><div class="score-row"><b>Vermoeidheid</b><input id="ciFatigue" type="range" min="1" max="10" value="${c.fatigue}" oninput="this.nextElementSibling.textContent=this.value"><span>${c.fatigue}</span></div><div class="score-row"><b>Slaap/herstel</b><input id="ciSleep" type="range" min="1" max="10" value="${c.sleep}" oninput="this.nextElementSibling.textContent=this.value"><span>${c.sleep}</span></div><div class="score-row"><b>Motivatie</b><input id="ciMotivation" type="range" min="1" max="10" value="${c.motivation}" oninput="this.nextElementSibling.textContent=this.value"><span>${c.motivation}</span></div><div class="field"><label>Pijn/klachten</label><select id="ciPain"><option value="none" ${c.pain==='none'?'selected':''}>Geen</option><option value="mild" ${c.pain==='mild'?'selected':''}>Licht/stijfheid</option><option value="moderate" ${c.pain==='moderate'?'selected':''}>Duidelijke pijn</option><option value="sharp" ${c.pain==='sharp'?'selected':''}>Scherpe/toenemende pijn</option></select></div><div class="field" style="margin-top:10px"><label>Opmerking</label><textarea id="ciNotes">${c.notes||''}</textarea></div><button class="btn primary" style="margin-top:12px" onclick="saveCheckin()">Weekcheck bewaren</button></div><div class="card advice"><h3>Advies</h3><p>${checkinAdvice(w)}</p></div>`}
function paceSecsFromLog(x){if(!x.distance||!x.duration)return 0;return x.duration*60/x.distance}
function fmtPace(sec){if(!sec||!isFinite(sec))return '-';const m=Math.floor(sec/60),s=Math.round(sec%60);return `${m}:${String(s).padStart(2,'0')}/km`}
function personalBasePace(){const easy=allLogs().filter(x=>x.status==='done'&&x.distance>=5&&x.duration&&x.hr&&x.hr<=138).slice(-8).map(paceSecsFromLog).filter(Boolean);if(easy.length>=2)return easy.reduce((a,b)=>a+b,0)/easy.length;return 330;}
function paceZones(){const b=personalBasePace();return [
['Herstel',b+25,b+55,'Heel ontspannen, RPE 2–3'],['Rustige duur',b-5,b+25,'Praattempo, meestal HR 120–135'],['Lange duur',b,b+30,'Bewust beheerst; duur is belangrijker dan snelheid'],['Steady',b-25,b-8,'Vlot maar comfortabel, RPE 4–5'],['HM-gevoel',b-40,b-20,'Voorlopige zone; bijstellen met langere tempo’s/racegegevens'],['Tempo/drempel',b-55,b-35,'Stevig gecontroleerd, RPE 6–7']];}
function renderZones(){const b=personalBasePace(),z=paceZones();zones.innerHTML=`<div class="hero"><h2>Persoonlijke tempo- & hartslagzones</h2><p>De app gebruikt je recente rustige trainingen als ijkpunt. Huidig geschat rustig basistempo: <b>${fmtPace(b)}</b>.</p></div><div class="card"><table class="pace-table"><thead><tr><th>Zone</th><th>Tempo</th><th>Gebruik</th></tr></thead><tbody>${z.map(x=>`<tr><td><b>${x[0]}</b></td><td>${fmtPace(x[1]).replace('/km','')} – ${fmtPace(x[2])}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table><p class="footer-note">Zolang er weinig loggegevens zijn vertrekt de app van je huidige basis van ongeveer 5:30/km. Met minstens twee rustige gelogde lopen ≤138 bpm verschuiven de zones automatisch mee.</p></div><div class="card"><h3>Hartslag</h3><div class="zone-grid"><div class="zone"><strong>Z1 · 91–109</strong><span class="muted">zeer licht</span></div><div class="zone"><strong>Z2 · 109–127</strong><span class="muted">rustige duur</span></div><div class="zone"><strong>Z3 · 127–146</strong><span class="muted">steady</span></div><div class="zone"><strong>Z4 · 146–164</strong><span class="muted">tempo</span></div><div class="zone"><strong>Z5 · 164–182</strong><span class="muted">hard</span></div></div></div><div class="tip ok"><b>Belangrijk:</b> tempozones zijn richtwaarden. Bij warmte, wind, vermoeidheid of heuvels krijgt inspanning/hartslag voorrang op exact tempo.</div>`}
function weeklyStats(){const out=[];for(const w of weeks){const a=[];for(let i=0;i<w.sessions.length;i++){const l=getLog(w.w,i);if(l&&l.status==='done')a.push(l)}out.push({w:w.w,km:a.reduce((s,x)=>s+(x.distance||0),0),pace:(()=>{const d=a.reduce((s,x)=>s+(x.distance||0),0),m=a.reduce((s,x)=>s+(x.duration||0),0);return d&&m?m*60/d:0})(),hr:(()=>{const h=a.filter(x=>x.hr).map(x=>x.hr);return h.length?h.reduce((a,b)=>a+b,0)/h.length:0})()})}return out;}
function barChart(data,key,label){const valid=data.filter(x=>x[key]>0),max=Math.max(1,...valid.map(x=>x[key]));const W=760,H=220,pad=34,bw=(W-pad*2)/16;return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>${data.map((x,i)=>{const v=x[key]||0,h=(H-pad*2)*(v/max),xx=pad+i*bw+4,yy=H-pad-h;return `<rect class="bar" x="${xx}" y="${yy}" width="${Math.max(8,bw-8)}" height="${h}" rx="3"/><text x="${xx+bw/2-4}" y="${H-12}" text-anchor="middle">${x.w}</text>${v?`<text x="${xx+bw/2-4}" y="${Math.max(12,yy-5)}" text-anchor="middle">${key==='pace'?fmtPace(v).replace('/km',''):v.toFixed(key==='km'?1:0)}</text>`:''}`}).join('')}</svg></div>`}
function renderDashboard(){const a=allLogs().filter(x=>x.status==='done');const km=a.reduce((s,x)=>s+x.distance,0),min=a.reduce((s,x)=>s+x.duration,0),hrs=a.filter(x=>x.hr).map(x=>x.hr),avg=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):0;const rpes=a.filter(x=>x.rpe).map(x=>x.rpe),rpe=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1):'-';const ws=weeklyStats();dashboard.innerHTML=`<div class="hero"><h2>Voortgang</h2><div class="stat-grid"><div class="stat"><strong>${a.length}</strong><span>trainingen</span></div><div class="stat"><strong>${km.toFixed(1)}</strong><span>km gelogd</span></div><div class="stat"><strong>${Math.round(min/60*10)/10}</strong><span>uur gelopen</span></div><div class="stat"><strong>${avg||'-'}</strong><span>gem. bpm</span></div></div></div><div class="card"><h3>Kilometers per week</h3>${barChart(ws,'km','Kilometers per week')}</div><div class="card"><h3>Gemiddelde hartslag per week</h3>${barChart(ws,'hr','Gemiddelde hartslag per week')}</div><div class="card"><h3>Belastingsgevoel</h3><p>Gemiddelde RPE: <b>${rpe}</b> / 10</p><p class="advice">${advice()}</p><p><b>Weekcheck:</b> ${checkinAdvice()}</p></div><div class="card"><h3>Backup</h3><p class="muted">Je gegevens staan lokaal in deze browser. Exporteer af en toe een backup.</p><button class="btn" onclick="exportData()">Exporteer backup</button> <label class="btn">Importeer backup<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div>`}
function hav(lat1,lon1,lat2,lon2){const R=6371000,rad=Math.PI/180,dlat=(lat2-lat1)*rad,dlon=(lon2-lon1)*rad,a=Math.sin(dlat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
function parseGarminFile(text,name){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw new Error('Ongeldig XML-bestand');let distance=0,duration=0,hr=0,date='',title=name.replace(/\.(tcx|gpx)$/i,'');const isTcx=xml.getElementsByTagNameNS('*','Activity').length>0;if(isTcx){const laps=[...xml.getElementsByTagNameNS('*','Lap')];distance=laps.reduce((s,l)=>s+Number(l.getElementsByTagNameNS('*','DistanceMeters')[0]?.textContent||0),0);duration=laps.reduce((s,l)=>s+Number(l.getElementsByTagNameNS('*','TotalTimeSeconds')[0]?.textContent||0),0);const hrs=[...xml.getElementsByTagNameNS('*','HeartRateBpm')].map(e=>Number(e.getElementsByTagNameNS('*','Value')[0]?.textContent||0)).filter(Boolean);hr=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):0;date=xml.getElementsByTagNameNS('*','Id')[0]?.textContent?.slice(0,10)||'';}else{const pts=[...xml.getElementsByTagNameNS('*','trkpt')];for(let i=1;i<pts.length;i++)distance+=hav(+pts[i-1].getAttribute('lat'),+pts[i-1].getAttribute('lon'),+pts[i].getAttribute('lat'),+pts[i].getAttribute('lon'));const times=pts.map(p=>new Date(p.getElementsByTagNameNS('*','time')[0]?.textContent||'')).filter(d=>!isNaN(d));if(times.length>1){duration=(times.at(-1)-times[0])/1000;date=times[0].toISOString().slice(0,10)}const hrs=[...xml.getElementsByTagNameNS('*','hr')].map(e=>Number(e.textContent)).filter(Boolean);hr=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):0;}return {title,date,distance:distance/1000,duration:duration/60,hr};}
function importGarmin(event){const f=event.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=parseGarminFile(r.result,f.name);localStorage.setItem('hm16-garmin-pending',JSON.stringify(d));renderGarmin();}catch(e){alert('Import mislukt: '+e.message)}};r.readAsText(f)}
function saveGarminImport(){const d=JSON.parse(localStorage.getItem('hm16-garmin-pending')||'null');if(!d)return;const w=Number(gWeek.value),i=Number(gSession.value);localStorage.setItem(logKey(w,i),JSON.stringify({date:d.date,status:'done',distance:+d.distance.toFixed(2),duration:Math.round(d.duration),hr:d.hr,rpe:0,notes:'Geïmporteerd uit Garmin-bestand'}));localStorage.setItem(k(w,i),'1');localStorage.removeItem('hm16-garmin-pending');renderAll();alert('Garmin-training aan het schema gekoppeld.');}
function renderGarmin(){const d=JSON.parse(localStorage.getItem('hm16-garmin-pending')||'null');garmin.innerHTML=`<div class="hero"><h2><span class="garmin-logo">GARMIN</span> integratie</h2><p>Importeer nu al activiteiten uit Garmin Connect. De officiële automatische cloudkoppeling kan geactiveerd worden zodra API-toegang en OAuth-credentials beschikbaar zijn.</p></div><div class="card"><h3>1. Nu bruikbaar · bestand importeren</h3><p>Exporteer een loopactiviteit uit Garmin Connect als <b>TCX</b> of <b>GPX</b> en kies het bestand hieronder. Afstand, duur, datum en waar beschikbaar hartslag worden ingelezen.</p><label class="btn primary">Kies Garmin TCX/GPX<input type="file" accept=".tcx,.gpx,application/xml,text/xml" onchange="importGarmin(event)" style="display:none"></label>${d?`<div class="notice ok"><b>${d.title}</b><br>${d.date||'datum onbekend'} · ${d.distance.toFixed(2)} km · ${Math.round(d.duration)} min · ${d.hr?d.hr+' bpm':'geen HR'}<div class="form-grid" style="margin-top:10px"><div class="field"><label>Week</label><select id="gWeek">${weeks.map(w=>`<option value="${w.w}" ${w.w===currentWeek()+1?'selected':''}>Week ${w.w}</option>`).join('')}</select></div><div class="field"><label>Training nr.</label><select id="gSession"><option value="1">Dinsdag · looptraining</option><option value="3">Donderdag · looptraining</option><option value="6">Zondag · lange duurloop</option></select></div></div><button class="btn primary" style="margin-top:10px" onclick="saveGarminImport()">Koppel aan schema</button></div>`:''}</div><div class="card"><h3>2. Officiële automatische koppeling</h3><div class="notice warn"><b>Status: nog niet geactiveerd.</b><br>Garmin vereist toelating tot het Garmin Connect Developer Program. Daarna gebruikt de koppeling OAuth 2.0 en de Activity API. Een puur statische PWA mag het client secret niet veilig bevatten; hiervoor is een kleine server/API nodig.</div><p>Na activatie kan de flow worden: Garmin Connect → jouw server → deze app. Nieuwe loopactiviteiten kunnen dan automatisch afstand, tijd, hartslag en andere beschikbare activiteitgegevens invullen. Met de Training API kan een volgende stap ook trainingen vanuit deze app naar Garmin Connect sturen.</p><p class="muted">De map <b>server/</b> in deze versie bevat de technische integratienota en een configuratiesjabloon voor de latere serverkoppeling.</p></div>`}
function renderToday(){const w=weeks[currentWeek()];const done=w.sessions.filter((_,i)=>sessionStatus(w.w,i)==='done').length;today.innerHTML=`<div class="hero"><h2>Week ${w.w} · ${w.focus}</h2><p>${w.dates}</p><div class="progress"><div style="width:${done/w.sessions.length*100}%"></div></div><p class="muted">${done}/${w.sessions.length} geplande dagen geregistreerd als uitgevoerd</p></div><div class="card">${w.sessions.map((s,i)=>`<div class="session"><span><b>${s[0]} · ${s[1]}</b><small>${s[2]}</small></span><div class="session-actions"><button class="btn primary" onclick="openLog(${w.w},${i})">${sessionStatus(w.w,i)?'Wijzig':'Log'}</button></div></div>`).join('')}</div><div class="card advice"><h3>Advies</h3><p>${advice()}</p><p><b>Herstel:</b> ${checkinAdvice(w.w)}</p></div><div class="card"><h3>Vaste weekindeling</h3><p><b>Ma</b> kracht A · <b>Di</b> lopen · <b>Wo</b> kracht B · <b>Do</b> lopen · <b>Vr</b> lichte kracht C · <b>Za</b> rust · <b>Zo</b> lange duurloop.</p></div><div class="card"><h3>Persoonlijk tempo</h3><p>Geschat rustig basistempo: <b>${fmtPace(personalBasePace())}</b>. Bekijk <b>Tempo & HR</b> voor alle zones.</p></div>`}

function renderAll(){renderWeeks();renderToday();renderLog();renderCheckin();renderStrength();renderDashboard();renderZones();renderGarmin()}
const weeksEl=document.getElementById('weeks');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});renderAll();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
